<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo"></div><span>FlowSketch</span></div>
    <input id="projectName" class="project-name" value="未命名流程图" aria-label="项目名称">
    <div class="divider"></div>
    <button class="btn icon" id="undoBtn" title="撤销 (Ctrl+Z)">↶</button><button class="btn icon" id="redoBtn" title="重做 (Ctrl+Y)">↷</button>
    <button class="btn optional" id="copyBtn">⧉ 复制</button><button class="btn optional" id="deleteBtn">⌫ 删除</button>
    <div class="grow"></div><span id="saveState" class="status-pill">已自动保存</span>
    <button class="btn" id="newBtn">新建</button><button class="btn" id="jsonBtn">JSON</button><button class="btn primary" id="exportBtn">导出</button><button class="btn icon" id="helpBtn" title="快捷键">?</button>
  </header>
  <main class="workspace">
    <aside class="left">
      <section class="section"><h3 class="section-title">插入元素</h3><div class="tool-grid">
        <button class="tool" data-add="rect"><i class="preview"></i>矩形</button><button class="tool" data-add="roundRect"><i class="preview round"></i>圆角框</button>
        <button class="tool" data-add="ellipse"><i class="preview ellipse"></i>椭圆</button><button class="tool" data-add="diamond"><i class="preview diamond"></i>菱形</button>
        <button class="tool" data-add="text"><i class="preview text">T</i>文字</button><button class="tool" data-add="connector"><i class="preview line"></i>连接线</button>
        <button class="tool" data-add="tokenGrid"><i class="preview token"></i>Token 矩阵</button><button class="tool" data-add="note"><i class="preview note"></i>便签</button>
        <button class="tool" data-add="group"><i class="preview group"></i>分组容器</button><button class="tool" id="imageBtn"><i class="preview image"></i>图片</button>
      </div></section>
      <section class="section"><h3 class="section-title">页面与吸附</h3><div class="canvas-settings">
        <label class="check"><input id="snapToggle" type="checkbox" checked> 智能对齐与吸附</label>
        <label class="check" style="margin-top:8px"><input id="gridToggle" type="checkbox"> 显示网格</label>
        <div class="row"><label>网格间距</label><input id="gridSize" class="field small" type="number" value="20" min="5" max="100"></div>
      </div></section>
      <section class="section"><h3 class="section-title">图层 <span id="layerCount"></span></h3><div id="layerList"></div></section>
    </aside>
    <section class="stage" id="stage">
      <div class="viewport" id="viewport"><div class="canvas-wrap" id="canvasWrap"><div class="canvas" id="canvas"></div></div></div>
      <div class="stage-toolbar"><button class="btn icon" id="zoomOut">−</button><button class="btn" id="fitBtn">适应</button><span class="zoom-label" id="zoomLabel">100%</span><button class="btn icon" id="zoomIn">＋</button><div class="divider"></div><button class="btn icon" id="panBtn" title="画布平移 (按住空格)">✋</button></div>
    </section>
    <aside class="right"><div class="panel-head">属性</div><div class="prop-content" id="properties"></div></aside>
  </main>
</div>
<input id="imageInput" type="file" accept="image/*" hidden><input id="tokenImageInput" type="file" accept="image/*" hidden><input id="jsonInput" type="file" accept="application/json,.json" hidden>
<div id="toast" class="toast"></div>
<div id="modal" class="modal-backdrop"><div class="modal"><h3 id="modalTitle"></h3><div id="modalBody" class="modal-body"></div><div id="modalFoot" class="modal-foot"></div></div></div>
<script>
(()=>{'use strict';

    ['#1f2937','#475569','#f1f5f9','#6366f1','#ffffff'],['#134e4a','#14b8a6','#f0fdfa','#f43f5e','#ffffff'],['#4a044e','#c026d3','#fdf4ff','#06b6d4','#ffffff'],['#422006','#ea580c','#fff7ed','#4f46e5','#ffffff'],['#0c4a6e','#0ea5e9','#f0f9ff','#a855f7','#ffffff'],['#365314','#65a30d','#f7fee7','#d97706','#ffffff'],['#312e81','#4f46e5','#eef2ff','#ec4899','#ffffff'],['#881337','#e11d48','#fff1f2','#10b981','#ffffff'],['#27272a','#18181b','#fafafa','#f97316','#ffffff'],['#052e16','#16a34a','#f0fdf4','#7c3aed','#ffffff']
  ];

  const themes=[]; for(let i=0;i<120;i++){let b=basePalettes[i%basePalettes.length],shift=Math.floor(i/basePalettes.length); themes.push({name:`${adjectives[i%adjectives.length]} ${String(i+1).padStart(3,'0')}`,colors:b.map((c,j)=>shift?adjust(c,(shift-2)*4+(j%2?3:0)):c)});}

  let project=load()||fresh();
  function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE));return x&&x.elements?x:null}catch{return null}}
  function normalize(){let previousVersion=Number(project.version)||1;project.version=5;project.canvas={width:1400,height:900,bg:'#fff',grid:false,gridSize:20,snap:true,theme:0,...project.canvas};project.elements=(project.elements||[]).map((e,i)=>{let n={id:uid(),x:80+i*10,y:80+i*10,w:160,h:70,rotation:0,opacity:1,visible:true,locked:false,text:'',fontSize:18,fontWeight:600,fontFamily:'Microsoft YaHei',textColor:'#172554',fill:'#eff6ff',stroke:'#1d4ed8',strokeWidth:2,radius:8,align:'center',vAlign:'center',textOffsetX:0,textOffsetY:0,dash:false,shadow:true,...e};if(previousVersion<3&&n.type==='group'&&n.textOffsetY===-95)n.textOffsetY=0;if(n.type==='tokenGrid'){n.rows=clamp(Math.round(n.rows||1),1,100);n.cols=clamp(Math.round(n.cols||1),1,100);n.cellW=n.cellW||28;n.cellH=n.cellH||28;n.gapX=n.gapX??8;n.gapY=n.gapY??8;n.depthCount=clamp(Math.round(n.depthCount||1),1,20);n.extrude=n.extrude??10;n.stackX=n.stackX??12;n.stackY=n.stackY??12;n.colorMode=n.colorMode||'solid';n.colorChannels=Array.isArray(n.colorChannels)&&n.colorChannels.length?n.colorChannels:['color'];if(previousVersion<4){let size=tokenMetrics(n);n.w=size.totalW;n.h=size.totalH}}return n});}
  normalize(); commit(false); syncUI(); render(); setTimeout(fitCanvas,60);
  function commit(push=true){clearTimeout(saveTimer);$('#saveState').textContent='保存中…';saveTimer=setTimeout(()=>{localStorage.setItem(STORAGE,JSON.stringify(project));$('#saveState').textContent='已自动保存'},220);if(push){history=history.slice(0,historyIndex+1);history.push(JSON.stringify(project));if(history.length>80)history.shift();historyIndex=history.length-1;}else if(!history.length){history=[JSON.stringify(project)];historyIndex=0}updateUndo()}
  function updateUndo(){$('#undoBtn').disabled=historyIndex<=0;$('#redoBtn').disabled=historyIndex>=history.length-1}

  function exportPNG(){let url=URL.createObjectURL(new Blob([projectSVG()],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(2,4096/Math.max(project.canvas.width,project.canvas.height));c.width=Math.round(project.canvas.width*scale);c.height=Math.round(project.canvas.height*scale);let x=c.getContext('2d');x.scale(scale,scale);x.drawImage(img,0,0);c.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safeName(project.name)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('PNG 已导出')},'image/png');URL.revokeObjectURL(url);closeModal()};img.onerror=()=>{URL.revokeObjectURL(url);toast('PNG 生成失败')};img.src=url}
  function safeName(s){return (s||'flowsketch').replace(/[\\/:*?"<>|]/g,'_')}
  function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function projectSVG(){let defs=`<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".18"/></filter><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="context-stroke"/></marker></defs>`;let content=project.elements.filter(e=>e.visible!==false).map(e=>e.type==='connector'?svgConnector(e):svgShape(e)).join('');return `<svg xmlns="http://www.w3.org/2000/svg" width="${project.canvas.width}" height="${project.canvas.height}" viewBox="0 0 ${project.canvas.width} ${project.canvas.height}">${defs}<rect width="100%" height="100%" fill="${project.canvas.bg}"/>${content}</svg>`}
  function svgConnector(e){let {a,b}=points(e);return `<path d="${pathData(e,a,b)}" fill="none" stroke="${e.stroke}" stroke-width="${e.strokeWidth}" ${e.dash?'stroke-dasharray="8 6"':''} ${e.arrowEnd?'marker-end="url(#arrow)"':''}/>`}
  function svgText(e,x=e.x,y=e.y,w=e.w,h=e.h){let lines=String(e.text||'').split('\n'),anchor={left:'start',center:'middle',right:'end'}[e.align],tx=e.align==='left'?x+(e.padding||8):e.align==='right'?x+w-(e.padding||8):x+w/2,lh=e.fontSize*1.25,total=lines.length*lh,ty=e.vAlign==='top'?y+(e.padding||8)+e.fontSize:e.vAlign==='bottom'?y+h-(e.padding||8)-total+e.fontSize:y+(h-total)/2+e.fontSize;return `<text x="${tx+(e.textOffsetX||0)}" y="${ty+(e.textOffsetY||0)}" text-anchor="${anchor}" font-family="${esc(e.fontFamily)}" font-size="${e.fontSize}" font-weight="${e.fontWeight}" fill="${e.textColor}">${lines.map((s,i)=>`<tspan x="${tx+(e.textOffsetX||0)}" dy="${i?lh:0}">${esc(s)}</tspan>`).join('')}</text>`}
  function svgShape(e){let tr=`transform="rotate(${e.rotation||0} ${e.x+e.w/2} ${e.y+e.h/2})" opacity="${e.opacity}"`,sh=e.shadow?'filter="url(#shadow)"':'',dash=e.dash?'stroke-dasharray="8 6"':'',shape='';if(e.type==='tokenGrid'){let m=tokenMetrics(e);shape=`<g transform="translate(${e.x} ${e.y}) scale(${e.w/m.totalW} ${e.h/m.totalH})">${tokenMarkup(e)}</g>`}else if(e.type==='ellipse')shape=`<ellipse cx="${e.x+e.w/2}" cy="${e.y+e.h/2}" rx="${e.w/2}" ry="${e.h/2}" fill="${e.fill}" stroke="${e.stroke}" stroke-width="${e.strokeWidth}" ${dash}/>`;else if(e.type==='diamond')shape=`<polygon points="${e.x+e.w/2},${e.y} ${e.x+e.w},${e.y+e.h/2} ${e.x+e.w/2},${e.y+e.h} ${e.x},${e.y+e.h/2}" fill="${e.fill}" stroke="${e.stroke}" stroke-width="${e.strokeWidth}" ${dash}/>`;else if(e.type==='image')shape=`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="${e.radius}" fill="${e.fill}"/><image href="${e.src}" x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" preserveAspectRatio="xMidYMid slice"/>`;else shape=`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="${e.radius}" fill="${e.type==='text'?'transparent':e.fill}" stroke="${e.stroke}" stroke-width="${e.strokeWidth}" ${dash}/>`;return `<g ${tr} ${sh}>${shape}${['image','tokenGrid'].includes(e.type)?'':svgText(e)}</g>`}
  function showJSON(){modal('项目 JSON',`<textarea class="json-area" id="jsonArea">${esc(JSON.stringify(project,null,2))}</textarea>`,`<button class="btn" id="jsonImportFile">从文件导入</button><button class="btn" id="jsonDownload">下载 JSON</button><button class="btn primary" id="jsonApply">应用编辑内容</button>`);$('#jsonDownload').onclick=exportJSON;$('#jsonImportFile').onclick=()=>$('#jsonInput').click();$('#jsonApply').onclick=()=>{try{let p=JSON.parse($('#jsonArea').value);if(!p.elements||!p.canvas)throw Error();project=p;normalize();selection=[];commit();syncUI();render();closeModal();toast('项目 JSON 已载入')}catch{toast('JSON 格式不正确')}}}
  function showExport(){modal('导出成品',`<p>SVG 适合继续排版与论文插图；PNG 适合直接预览和分享。两者都会按画布原始尺寸导出。</p>`,`<button class="btn" id="exportPng">导出 PNG</button><button class="btn primary" id="exportSvg">导出 SVG</button>`);$('#exportSvg').onclick=()=>{download(`${safeName(project.name)}.svg`,projectSVG(),'image/svg+xml');closeModal();toast('SVG 已导出')};$('#exportPng').onclick=exportPNG}
  function modal(title,body,foot){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}function confirmModal(title,text,yes){modal(title,`<p>${esc(text)}</p>`,`<button class="btn" id="cancelModal">取消</button><button class="btn primary" id="yesModal">确定</button>`);$('#cancelModal').onclick=closeModal;$('#yesModal').onclick=()=>{closeModal();yes()}}
  function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
  $$('.tool[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('#imageBtn').onclick=()=>$('#imageInput').click();$('#imageInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>add('image',{src:r.result,text:'',w:260,h:170,fill:'#fff',stroke:'#8290a8',strokeWidth:1});r.readAsDataURL(f);e.target.value=''};$('#tokenImageInput').onchange=ev=>{let input=ev.target,f=input.files[0],targetId=input.dataset.target;if(!f)return;let reader=new FileReader();reader.onload=async()=>{let e=el(targetId);if(!e||e.type!=='tokenGrid')return;try{toast('正在分块并计算平均颜色…');let prepared=await prepareTokenImage(reader.result);e.colorImage=prepared.dataUrl;e.colorImageName=f.name;e.colorMode='image';e.colorChannels=Array.isArray(e.colorChannels)&&e.colorChannels.length?e.colorChannels:['color'];e.depthCount=e.colorChannels.length;await repoolTokenImage(e);e.poolSourceWidth=prepared.originalWidth;e.poolSourceHeight=prepared.originalHeight;let size=tokenMetrics(e);e.w=size.totalW;e.h=size.totalH;selection=[e.id];commit();render();toast(`已生成 ${e.rows*e.cols} 个池化色块`)}catch{toast('图片池化失败')}};reader.readAsDataURL(f);input.value=''};
  $('#projectName').onchange=e=>{project.name=e.target.value||'未命名流程图';commit()};$('#snapToggle').onchange=e=>{project.canvas.snap=e.target.checked;commit();renderProps()};$('#gridToggle').onchange=e=>{project.canvas.grid=e.target.checked;syncUI();commit()};$('#gridSize').onchange=e=>{project.canvas.gridSize=clamp(+e.target.value,5,100);syncUI();commit()};
  $('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#copyBtn').onclick=duplicate;$('#deleteBtn').onclick=remove;$('#zoomIn').onclick=()=>setZoom(zoom+.1);$('#zoomOut').onclick=()=>setZoom(zoom-.1);$('#fitBtn').onclick=fitCanvas;$('#panBtn').onclick=()=>{panMode=!panMode;$('#panBtn').classList.toggle('active',panMode)};$('#jsonBtn').onclick=showJSON;$('#exportBtn').onclick=showExport;
  $('#newBtn').onclick=()=>confirmModal('新建项目','新建会替换当前画布，当前项目已自动保存在本浏览器中。',()=>{project=fresh();selection=[];history=[];historyIndex=-1;commit(false);syncUI();render();fitCanvas()});$('#helpBtn').onclick=()=>modal('快捷键',`<div class="shortcut-grid"><span>撤销 / 重做</span><span><i class="kbd">Ctrl Z</i> <i class="kbd">Ctrl Y</i></span><span>复制元素</span><i class="kbd">Ctrl D</i><span>删除元素</span><i class="kbd">Delete</i><span>微移 / 快速移动</span><span><i class="kbd">方向键</i> / <i class="kbd">Shift</i></span><span>多选</span><i class="kbd">Shift 单击</i><span>画布平移</span><i class="kbd">Space 拖动</i><span>等比例旋转</span><i class="kbd">Shift 拖动</i></div>`,`<button class="btn primary" id="closeHelp">知道了</button>`);document.addEventListener('click',e=>{if(e.target.id==='closeHelp')closeModal()});$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal()});
  $('#jsonInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{project=JSON.parse(r.result);normalize();selection=[];commit();syncUI();render();closeModal();fitCanvas();toast('项目已导入')}catch{toast('无法读取这个 JSON')}};r.readAsText(f);e.target.value=''};
  window.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.code==='Space'){spaceDown=true;e.preventDefault()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate()}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();remove()}else if(e.key==='Escape'){selection=[];render()}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let d=e.shiftKey?10:1;nudge(e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0,e.key==='ArrowUp'?-d:e.key==='ArrowDown'?d:0)}});window.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});window.addEventListener('resize',()=>syncUI());viewport.addEventListener('wheel',e=>{e.preventDefault();setZoomAt(zoom*Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});viewport.addEventListener('pointerdown',e=>{if(e.button!==1)return;e.preventDefault();e.stopPropagation();viewport.setPointerCapture?.(e.pointerId);interaction={type:'pan',x:e.clientX,y:e.clientY,sl:viewport.scrollLeft,st:viewport.scrollTop};canvas.classList.add('grabbing')},true);viewport.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});
})();
</script>
